server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: futbolin-api
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/football_trivia}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: ${APP_REDIS_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  redis:
    enabled: ${APP_REDIS_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-super-secret-key-32bytes!!}
    access-token-minutes: 15
    refresh-token-days: 30
  oauth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    apple-audience: ${APPLE_AUDIENCE:}
  match:
    question-seconds: 10
    duration-seconds: 240
    goals-to-win: 3
    reconnect-seconds: 15
    min-answer-millis: 180
    matchmaking-timeout-seconds: 20
    penalty-kicks: 5
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:8080}
  seed:
    admin-email: ${ADMIN_EMAIL:admin@futbolin.app}
    admin-password: ${ADMIN_PASSWORD:Admin123!}
    admin-username: ${ADMIN_USERNAME:admin}

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} correlation=%X{correlationId:-} - %msg%n'
  level:
    com.futbolin: INFO
    org.springframework.web: WARN
